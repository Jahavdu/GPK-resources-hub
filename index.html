<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mechatronics by Durvesh</title>
    <!-- Firebase SDK v9+ Modular -->
    <script type="module">
        // Firebase will be initialized in the main script section below
        window.firebaseLoaded = true;
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --modal-bg: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.3);
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.1) 0%, transparent 60%);
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); } 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); } }

        .animate-enter { animation: fadeInUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        /* Staggered Animation Delays for Lists */
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; }
        
        /* --- UI ELEMENTS --- */
        .btn { padding: 10px 18px; border-radius: 12px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transform: scale(1); }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--accent); color: #0f172a; box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-primary:hover { box-shadow: 0 6px 20px var(--accent-glow); transform: translateY(-2px); }
        .btn-gold { background: var(--gold); color: #0f172a; box-shadow: 0 4px 15px var(--gold-glow); }
        .btn-ghost { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid var(--danger); }
        .btn-sm { padding: 5px 12px; font-size: 0.75rem; border-radius: 8px; }

        .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase; margin-left: 6px; display: inline-block; vertical-align: middle; letter-spacing: 0.5px; }
        .bg-gold { background: linear-gradient(45deg, #fbbf24, #d97706); color: #000; }
        .bg-blue { background: linear-gradient(45deg, #38bdf8, #2563eb); color: #fff; }
        .bg-green { background: linear-gradient(45deg, #4ade80, #16a34a); color: #000; }

        input, select, textarea { 
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); 
            padding: 15px; border-radius: 12px; color: white; outline: none; margin-bottom: 15px; 
            font-size: 1rem; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: rgba(0,0,0,0.5); box-shadow: 0 0 15px rgba(56, 189, 248, 0.1); }

        /* --- NAV --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100; background: rgba(15, 23, 42, 0.85);
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: white; letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }

        .desktop-links { display: flex; gap: 5px; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 50px; border: 1px solid var(--border); }
        .desktop-links button {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 0.9rem; padding: 8px 18px; transition: 0.3s;
            border-radius: 25px; font-weight: 500;
        }
        .desktop-links button:hover { color: white; background: rgba(255,255,255,0.05); }
        .desktop-links button.active { background: var(--accent); color: #0f172a; font-weight: 700; box-shadow: 0 2px 10px var(--accent-glow); }
        .founder-btn { color: var(--gold) !important; }
        .founder-btn.active { background: var(--gold) !important; color: #000 !important; box-shadow: 0 2px 10px var(--gold-glow) !important; }

        /* Mobile Bottom Nav */
        .bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); z-index: 999;
            justify-content: space-around; padding: 12px 0; padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        .bottom-nav button { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 4px; width: 18%; transition: 0.3s; }
        .bottom-nav button svg { width: 24px; height: 24px; fill: currentColor; transition: 0.3s; }
        .bottom-nav button.active { color: var(--accent); }
        .bottom-nav button.active svg { transform: translateY(-3px); filter: drop-shadow(0 0 5px var(--accent)); }

        /* FLOATING UPLOAD BUTTON (MOBILE) */
        .fab {
            position: fixed; bottom: 85px; right: 20px; width: 55px; height: 55px;
            background: var(--accent); border-radius: 50%; display: none;
            align-items: center; justify-content: center; color: #0f172a;
            box-shadow: 0 5px 20px var(--accent-glow); z-index: 1000;
            font-size: 2rem; border: none; cursor: pointer; animation: pulse 2s infinite;
        }
        .fab:active { transform: scale(0.9); }

        /* --- LAYOUT --- */
        main { flex: 1; padding: 30px 5%; max-width: 1000px; margin: 0 auto; width: 100%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .card { 
            background: var(--card-bg); border: 1px solid var(--border); padding: 25px; 
            border-radius: 20px; position: relative; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 0; animation: fadeInUp 0.5s ease forwards;
        }
        .card:hover { transform: translateY(-5px) scale(1.01); border-color: var(--accent); box-shadow: 0 15px 30px -10px var(--accent-glow); }
        
        .tag { font-size: 0.75rem; padding: 5px 12px; background: rgba(56, 189, 248, 0.1); color: var(--accent); border-radius: 50px; display: inline-block; margin-bottom: 15px; font-weight: 700; border: 1px solid rgba(56, 189, 248, 0.2); }

        /* --- PROFILE --- */
        .profile-card { text-align: center; padding: 40px 20px; background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent); }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--accent); color: #000; font-size: 3rem; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border: 4px solid rgba(255,255,255,0.1); animation: float 6s ease-in-out infinite; }
        
        /* --- THREAD VIEW --- */
        .thread-header { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        .thread-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
        .comment-item { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid var(--border); }

        /* --- ADMIN TABS --- */
        .admin-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .admin-tabs button { white-space: nowrap; padding: 10px 20px; border-radius: 50px; background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); font-weight: 600; transition: 0.3s; }
        .admin-tabs button.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 0 15px var(--gold-glow); }

        /* --- UTILS --- */
        .hidden { display: none !important; }
        .clickable { cursor: pointer; }

        @media (max-width: 850px) {
            .desktop-links, .nav-logout { display: none; }
            .bottom-nav, .fab { display: flex; }
            nav { justify-content: center; }
            main { padding: 20px 15px; }
        }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: end; z-index: 2000; opacity: 0; pointer-events: none; transition: 0.3s; }
        @media(min-width: 769px) { .modal-overlay { align-items: center; } }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: #1e293b; width: 100%; max-width: 700px; max-height: 90vh; border-radius: 24px 24px 0 0; border-top: 1px solid var(--accent); transform: translateY(100%); transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1); overflow-y: auto; }
        @media(min-width: 769px) { .modal-content { border-radius: 24px; transform: scale(0.95); border: 1px solid var(--border); } }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        @media(min-width: 769px) { .modal-overlay.active .modal-content { transform: scale(1); } }
        .modal-body { padding: 30px; }
        .close-modal { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border: none; color: white; font-size: 1.5rem; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .close-modal:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg); }

        /* --- TOAST --- */
        #toast-container { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 2200; width: 90%; max-width: 350px; text-align: center; pointer-events: none; }
        .toast { background: rgba(15, 23, 42, 0.95); border: 1px solid var(--accent); color: white; padding: 12px 24px; border-radius: 50px; margin-top: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); opacity: 0; transition: 0.3s; transform: translateY(-20px) scale(0.9); display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
        .toast.show { opacity: 1; transform: translateY(0) scale(1); }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <nav id="navbar" class="hidden">
        <div class="logo">Mechatronics<span>.</span></div>
        <div class="nav-links desktop-links" id="desktop-menu">
            <button onclick="app.navigate('home')">Library</button>
            <button onclick="app.navigate('projects')">Projects</button>
            <button onclick="app.navigate('forum')">Forum</button>
            <button onclick="app.navigate('events')">Events</button>
            <button onclick="app.navigate('about')">About</button>
            <button onclick="app.navigate('profile')">My Profile</button>
            <button onclick="app.navigate('upload')" style="color:var(--accent)">+ Upload</button>
            <button id="desk-admin-btn" class="hidden founder-btn" onclick="app.navigate('admin')">Dashboard</button>
        </div>
        <div class="nav-logout">
            <button class="btn btn-danger" style="padding: 8px 16px;" onclick="app.logout()">Logout</button>
        </div>
    </nav>

    <main id="app-root">
        </main>

    <button class="fab hidden" id="mob-fab" onclick="app.navigate('upload')">+</button>

    <div class="bottom-nav hidden" id="mobile-menu">
        <button onclick="app.navigate('home')" id="mob-home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Lib</button>
        <button onclick="app.navigate('projects')" id="mob-projects"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg> Proj</button>
        <button onclick="app.navigate('forum')" id="mob-forum"><svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg> Chat</button>
        <button onclick="app.navigate('about')" id="mob-about"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg> About</button>
        <button onclick="app.navigate('profile')" id="mob-profile"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> Me</button>
        <button onclick="app.navigate('admin')" id="mob-admin" class="hidden" style="color:var(--gold)"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg> Admin</button>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="app.closeModal()">×</button>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script>
        /*
        ===========================================
        FIREBASE CONFIGURATION SETUP
        ===========================================
        1. Go to https://console.firebase.google.com/
        2. Create a new project (or use existing)
        3. Enable Firestore Database in Build > Firestore Database
        4. Set rules to test mode initially (update for production later)
        5. Go to Project Settings > General > Your apps
        6. Register a web app and copy the Firebase config
        7. Replace the firebaseConfig object below with your credentials

        FIRESTORE SECURITY RULES (for testing):
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /{document=**} {
              allow read, write: if true; // Change this for production!
            }
          }
        }
        ===========================================
        */

        /* --- FIREBASE INITIALIZATION --- */
        const firebaseConfig = {
          apiKey: "YOUR_API_KEY",
          authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
          projectId: "YOUR_PROJECT_ID",
          storageBucket: "YOUR_PROJECT_ID.appspot.com",
          messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
          appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        let firebaseApp, firestoreDb;
        try {
            firebaseApp = firebase.initializeApp(firebaseConfig);
            firestoreDb = firebase.firestore();
            console.log('Firebase initialized successfully');
        } catch (error) {
            console.error('Firebase initialization error:', error);
            alert('Firebase not configured. Please add your Firebase credentials in the script section.');
        }

        /* --- UTILS --- */
        const BAD_WORDS = ['bad', 'stupid', 'idiot', 'fail', 'trash', 'useless', 'kill', 'dumb'];
        const showToast = (msg) => {
            const el = document.createElement('div'); el.className = 'toast show'; el.innerHTML = `<span>✨</span> ${msg}`;
            document.getElementById('toast-container').appendChild(el); setTimeout(() => el.remove(), 3000);
        };
        const filterProfanity = (text) => {
            let words = text.split(' '), badCount = 0;
            let cleaned = words.map(w => { if(BAD_WORDS.some(bw => w.toLowerCase().includes(bw))) { badCount++; return '***'; } return w; });
            return { text: cleaned.join(' '), count: badCount };
        };

        /* --- DATABASE --- */
        // Firestore-based database operations (async)
        const db = {
            // Get all documents from a collection
            getData: async (k) => {
                try {
                    if (!firestoreDb) return [];
                    const snapshot = await firestoreDb.collection(k).get();
                    return snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
                } catch (error) {
                    console.error(`Error getting data from ${k}:`, error);
                    return [];
                }
            },

            // Save entire array to collection (replaces all documents)
            saveData: async (k, d) => {
                try {
                    if (!firestoreDb) return;
                    const batch = firestoreDb.batch();
                    
                    // Delete all existing documents
                    const existing = await firestoreDb.collection(k).get();
                    existing.docs.forEach(doc => batch.delete(doc.ref));
                    
                    // Add new documents
                    d.forEach(item => {
                        const docRef = firestoreDb.collection(k).doc();
                        batch.set(docRef, item);
                    });
                    
                    await batch.commit();
                } catch (error) {
                    console.error(`Error saving data to ${k}:`, error);
                }
            },

            // Push a new item to collection
            pushItem: async (k, i) => {
                try {
                    if (!firestoreDb) return;
                    
                    // For posts, we need to maintain order (newest first)
                    // For other collections, just add the document
                    await firestoreDb.collection(k).add(i);
                } catch (error) {
                    console.error(`Error pushing item to ${k}:`, error);
                }
            },

            // Update a specific user by name
            updateUser: async (name, data) => {
                try {
                    if (!firestoreDb) return;
                    const snapshot = await firestoreDb.collection('nexus_users')
                        .where('name', '==', name)
                        .get();
                    
                    if (!snapshot.empty) {
                        const doc = snapshot.docs[0];
                        await doc.ref.update(data);
                    }
                } catch (error) {
                    console.error(`Error updating user ${name}:`, error);
                }
            }
        };

        // Initialize default admin users (runs on app init)
        async function initializeDefaultUsers() {
            try {
                const users = await db.getData('nexus_users');
                if (users.length === 0) {
                    await db.pushItem('nexus_users', { name: 'Durvesh Jadhav', role: 'admin', type: 'main', pass: 'admin123', badges: ['FOUNDER'], uploads: 99 });
                    await db.pushItem('nexus_users', { name: 'Team', role: 'admin', type: 'sec', pass: 'team123', badges: ['ADMIN'], uploads: 0 });
                    console.log('Default admin users created');
                }
            } catch (error) {
                console.error('Error initializing default users:', error);
            }
        }
        }

        /* --- APP CONTROLLER --- */
        const app = {
            currentUser: null, adminTab: 'approvals',

            init: async () => {
                // Initialize default admin users if needed
                await initializeDefaultUsers();
                
                const s = sessionStorage.getItem('nexus_session');
                if(s) app.login(JSON.parse(s), true);
                else app.renderLogin();
            },

            renderLogin: () => {
                document.getElementById('navbar').classList.add('hidden');
                document.getElementById('mobile-menu').classList.add('hidden');
                document.getElementById('mob-fab').classList.add('hidden');
                document.getElementById('app-root').innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:85vh; padding:20px;" class="animate-enter">
                        <div class="logo" style="font-size:2.5rem; margin-bottom:40px;">Mechatronics<br><span style="font-size:1.2rem; opacity:0.8; font-weight:400;">Resource Hub</span></div>
                        <div id="login-form" style="background:var(--card-bg); padding:35px; border-radius:24px; border:1px solid var(--border); width:100%; max-width:380px;">
                            <h2 style="margin-bottom:25px; text-align:center;">Student Login</h2>
                            <form onsubmit="app.handleLogin(event)"><input type="text" id="l_name" placeholder="Full Name" required><input type="password" id="l_pass" placeholder="Password" required><button class="btn btn-primary" style="width:100%;">Login</button></form>
                            <p style="text-align:center; margin-top:20px; font-size:0.9rem; color:var(--text-muted);">No account? <span onclick="app.toggleAuth('register')" style="color:var(--accent); cursor:pointer;">Register</span></p>
                            <div style="margin:25px 0; border-top:1px solid var(--border);"></div>
                            <button class="btn" style="width:100%; justify-content:center; background:rgba(255,255,255,0.05); color:white; border:1px solid var(--border);" onclick="app.toggleAuth('founder')">Founder Access</button>
                        </div>
                        <div id="register-form" style="display:none; background:var(--card-bg); padding:35px; border-radius:24px; border:1px solid var(--border); width:100%; max-width:380px;">
                            <h2 style="margin-bottom:25px; text-align:center;">Register</h2>
                            <form onsubmit="app.handleRegister(event)"><input type="text" id="r_name" placeholder="Full Name" required><select id="r_dept" required><option value="" disabled selected>Department</option><option>Mechatronics</option><option>Computer</option><option>Civil</option><option>E&TC</option><option>Mechanical</option><option>Instrumentation</option><option>Electrical</option></select><input type="password" id="r_pass" placeholder="Create Password" required><button class="btn btn-success" style="width:100%;">Create Account</button></form>
                            <p style="text-align:center; margin-top:20px; font-size:0.9rem; color:var(--text-muted);"><span onclick="app.toggleAuth('login')" style="color:var(--accent); cursor:pointer;">Back to Login</span></p>
                        </div>
                        <div id="founder-form" style="display:none; background:var(--card-bg); padding:35px; border-radius:24px; border:1px solid var(--border); width:100%; max-width:380px;">
                            <h2 style="margin-bottom:25px; text-align:center;">Founder Login</h2>
                            <form onsubmit="app.handleFounderLogin(event)"><input type="text" id="f_name" placeholder="Username" required><input type="password" id="f_pass" placeholder="Password" required><button class="btn btn-gold" style="width:100%;">Access Dashboard</button></form>
                            <p style="text-align:center; margin-top:20px;"><span onclick="app.toggleAuth('login')" style="color:var(--text-muted); cursor:pointer;">Cancel</span></p>
                        </div>
                    </div>`;
            },
            toggleAuth: (v) => { ['login-form','register-form','founder-form'].forEach(id=>document.getElementById(id).style.display='none'); document.getElementById(v+'-form').style.display='block'; },
            
            handleLogin: async (e) => { 
                e.preventDefault(); 
                const users = await db.getData('nexus_users'); 
                const u = users.find(x => x.name === document.getElementById('l_name').value && x.pass === document.getElementById('l_pass').value); 
                u ? app.login(u) : showToast('Invalid Login'); 
            },
            handleRegister: async (e) => { 
                e.preventDefault(); 
                await db.pushItem('nexus_users', {
                    name:document.getElementById('r_name').value, 
                    dept:document.getElementById('r_dept').value, 
                    role:'student', 
                    pass:document.getElementById('r_pass').value, 
                    badges:['NEW'], 
                    uploads:0
                }); 
                showToast('Registered!'); 
                app.toggleAuth('login'); 
            },
            handleFounderLogin: (e) => { 
                e.preventDefault(); 
                const u = document.getElementById('f_name').value; const p = document.getElementById('f_pass').value;
                if(u==='Durvesh' && p==='admin123') app.login({name:'Durvesh Jadhav', role:'admin', type:'main', badges:['FOUNDER']}); 
                else if(u==='Team' && p==='team123') app.login({name:'Team', role:'admin', type:'sec', badges:['ADMIN']});
                else showToast('Access Denied'); 
            },

            login: (u, s=false) => { app.currentUser = u; if(!s) sessionStorage.setItem('nexus_session', JSON.stringify(u)); document.getElementById('navbar').classList.remove('hidden'); document.getElementById('mobile-menu').classList.remove('hidden'); const isAdmin = u.role === 'admin'; document.getElementById('desk-admin-btn').classList.toggle('hidden', !isAdmin); document.getElementById('mob-admin').classList.toggle('hidden', !isAdmin); document.getElementById('mob-fab').classList.remove('hidden'); app.navigate(isAdmin ? 'admin' : 'home'); },
            logout: () => { sessionStorage.removeItem('nexus_session'); app.renderLogin(); },
            navigate: (v) => { document.querySelectorAll('.bottom-nav button, .desktop-links button').forEach(b => b.classList.remove('active')); const mobBtn = document.getElementById('mob-'+v); if(mobBtn) mobBtn.classList.add('active'); if(v === 'admin') document.getElementById('desk-admin-btn').classList.add('active'); else { const buttons = Array.from(document.querySelectorAll('.desktop-links button')); const target = buttons.find(b => b.textContent.toLowerCase().includes(v) && b.id !== 'desk-admin-btn'); if(target) target.classList.add('active'); } window.scrollTo(0,0); app['render'+v.charAt(0).toUpperCase()+v.slice(1)](); },

            /* --- VIEWS --- */
            renderHome: async () => {
                const list = (await db.getData('nexus_materials')).filter(m => m.status==='approved');
                let html = `<div class="animate-enter"><h2 style="margin-bottom:20px;">Library</h2><div class="grid">`;
                list.forEach((m, i) => html += `<div class="card clickable stagger-${(i%3)+1}" onclick="app.openPostModal('note', ${m.id})"><span class="tag">${m.category}</span><h3>${m.title}</h3><p style="color:var(--text-muted); font-size:0.9rem;">${m.desc||'No details'}</p><div style="margin-top:10px; display:flex; justify-content:space-between;"><small onclick="event.stopPropagation(); app.openProfile('${m.author}')" class="clickable" style="color:var(--accent)">${m.author}</small><small style="color:var(--success)">Tap to View</small></div></div>`);
                document.getElementById('app-root').innerHTML = html + `</div></div>`;
            },
            
            renderProjects: async () => {
                const list = await db.getData('nexus_projects');
                const isMain = app.currentUser.type === 'main';
                let html = `<div class="animate-enter"><div style="display:flex; justify-content:space-between; margin-bottom:20px;"><h2>Projects</h2><button class="btn btn-primary" onclick="document.getElementById('pf').style.display='block'">+ Add</button></div>
                <div id="pf" style="display:none; background:var(--card-bg); padding:20px; border-radius:15px; margin-bottom:20px;"><form onsubmit="app.addProj(event)"><input id="pt" placeholder="Title" required><textarea id="pd" placeholder="Desc" required></textarea><button class="btn btn-primary">Submit</button></form></div><div class="grid">`;
                list.forEach((p, i) => html += `<div class="card clickable stagger-${(i%3)+1}" onclick="app.openPostModal('project', ${p.id})"><div style="display:flex; justify-content:space-between;"><h3>${p.title}</h3>${isMain ? `<button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); app.delItem('nexus_projects',${p.id})">Del</button>` : ''}</div><p style="color:var(--text-muted)">${p.desc}</p><div style="font-size:0.8rem; color:var(--text-muted); margin-top:10px;">Tap to see Gallery & Comments</div></div>`);
                document.getElementById('app-root').innerHTML = html + `</div></div>`;
            },

            renderForum: async () => {
                const list = (await db.getData('nexus_posts')).filter(p=>p.status!=='deleted');
                let html = `<div class="animate-enter"><h2 style="margin-bottom:20px;">Forum</h2><div class="card" style="margin-bottom:20px; padding:15px;"><form style="display:flex; gap:10px;" onsubmit="app.addPost(event)"><input id="p_txt" placeholder="Start a discussion..." required style="margin:0; border-radius:50px;"><button class="btn btn-primary" style="border-radius:50%; width:50px;">➤</button></form></div><div>`;
                list.forEach((p, i) => {
                    const replies = (p.replies || []).length;
                    const badge = p.badge ? `<span class="badge ${p.badge==='Legit'?'bg-blue':'bg-green'}">${p.badge}</span>` : '';
                    html += `<div class="card clickable stagger-${(i%3)+1}" style="margin-bottom:15px; padding:15px;" onclick="app.openPostModal('post', ${p.id})"><div style="display:flex; justify-content:space-between;"><h4 onclick="event.stopPropagation(); app.openProfile('${p.author}')" class="clickable" style="color:${p.author==='Durvesh Jadhav'?'var(--gold)':'var(--accent)'}">${p.author} ${p.author==='Durvesh Jadhav'?'★':''} ${badge}</h4></div><p style="margin-top:5px; margin-bottom:10px;">${p.content}</p><div style="display:flex; gap:10px; font-size:0.8rem; color:var(--text-muted);"><span>💬 ${replies} Replies</span><span>• Tap to view thread</span></div></div>`;
                });
                document.getElementById('app-root').innerHTML = html + `</div></div>`;
            },

            renderEvents: async () => {
                 const evs = await db.getData('nexus_events');
                 let html = `<div class="animate-enter"><h2>Events</h2><div style="margin-top:20px;">`;
                 if(evs.length===0) html+=`<p style="color:var(--text-muted)">No events yet.</p>`;
                 evs.forEach(e => html += `<div class="card"><h3>${e.title}</h3><p style="color:var(--text-muted)">${e.desc}</p></div>`);
                 document.getElementById('app-root').innerHTML = html + `</div></div>`;
            },

            renderAbout: () => { 
                document.getElementById('app-root').innerHTML = `
                    <div class="animate-enter" style="max-width:700px; margin:0 auto;">
                        <div class="card profile-card">
                            <div class="profile-avatar">D</div>
                            <h2 style="font-size:2rem; margin-bottom:5px;">Durvesh Jadhav</h2>
                            <p style="color:var(--accent); font-weight:700; letter-spacing:1px; margin-bottom:20px;">FOUNDER & LEAD DEVELOPER</p>
                            <div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; margin-bottom:20px;">
                                <h3 style="color:var(--text-main); margin-bottom:10px;">Department of Mechatronics</h3>
                                <p style="color:var(--text-muted); line-height:1.6;">"Our mission is to create a unified, verified, and collaborative digital ecosystem for all engineering students. Access notes, share projects, and grow together."</p>
                            </div>
                            <button class="btn btn-primary" onclick="alert('Email: contact@durvesh.com')">Connect with Durvesh</button>
                        </div>
                    </div>`; 
            },
            
            renderUpload: () => { 
                document.getElementById('app-root').innerHTML = `<div class="animate-enter"><h2>Upload</h2><div class="card" style="margin-top:20px;"><form onsubmit="app.doUpload(event)"><input id="ut" placeholder="Title" required><select id="uc" required><option value="" disabled selected>Select Department</option><option>Mechatronics</option><option>Computer</option><option>Civil</option><option>Electronics & Telecommunication</option><option>Mechanical</option><option>Instrumentation</option><option>Electrical</option></select><textarea id="ud" placeholder="Description"></textarea><label style="display:block; margin-bottom:5px; font-size:0.8rem; color:var(--text-muted)">Attach File:</label><input type="file" id="uf" required style="padding:10px;"><button class="btn btn-primary" style="width:100%; margin-top:10px;">Submit for Review</button></form></div></div>`; 
            },

            renderProfile: () => { app.openProfile(app.currentUser.name, true); },

            renderAdmin: async () => {
                const pend = (await db.getData('nexus_materials')).filter(m=>m.status==='pending');
                const users = (await db.getData('nexus_users')).filter(u=>u.role!=='admin');
                const isMain = app.currentUser.type === 'main';

                let content = '';
                if(app.adminTab==='approvals') content = pend.map(m=>`<div class="card" style="margin-bottom:10px;"><h4>${m.title}</h4><p>${m.category}</p><div style="margin-top:10px;"><button class="btn btn-success" onclick="app.admDecide(${m.id},'approved')">Approve</button> <button class="btn btn-danger" onclick="app.admDecide(${m.id},'reject')">Reject</button></div></div>`).join('') || '<p>No pending files.</p>';
                if(app.adminTab==='events') content = `<div class="card"><form onsubmit="app.addEvt(event)"><input id="et" placeholder="Title" required><textarea id="ed" placeholder="Desc"></textarea><button class="btn btn-primary">Add Event</button></form></div>`;
                if(app.adminTab==='users') {
                    if(!isMain) content = `<p style="color:var(--danger)">Access Restricted: Main Founder Only</p>`;
                    else content = users.map(u => `<div class="card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;"><div><strong>${u.name}</strong><br><small style="color:var(--text-muted)">${u.dept || 'Student'}</small></div><div><button class="btn btn-gold btn-sm" onclick="app.giveUserBadge('${u.name}', 'EXPERT')">Give Expert</button></div></div>`).join('');
                }

                document.getElementById('app-root').innerHTML = `
                    <div class="animate-enter"><h2 style="color:var(--gold)">Founder Dashboard</h2>
                    <div class="admin-tabs">
                        <button class="${app.adminTab==='approvals'?'active':''}" onclick="app.adminTab='approvals';app.renderAdmin()">Approvals</button>
                        <button class="${app.adminTab==='events'?'active':''}" onclick="app.adminTab='events';app.renderAdmin()">Events</button>
                        <button class="${app.adminTab==='users'?'active':''}" onclick="app.adminTab='users';app.renderAdmin()">Students</button>
                    </div>${content}</div>`;
            },

            /* --- SUBREDDIT-STYLE MODAL --- */
            openPostModal: async (type, id) => {
                document.getElementById('modal-overlay').classList.add('active');
                const content = document.getElementById('modal-body');
                const isMain = app.currentUser.type === 'main';
                
                if(type === 'post') {
                    const posts = await db.getData('nexus_posts');
                    const p = posts.find(x=>x.id===id);
                    const badge = p.badge ? `<span class="badge ${p.badge==='Legit'?'bg-blue':'bg-green'}">${p.badge}</span>` : '';
                    let html = `<div class="thread-header"><h2 class="thread-title">${p.title || 'Discussion'}</h2><div class="thread-meta">Posted by <span class="clickable" style="color:var(--accent)" onclick="app.openProfile('${p.author}')">${p.author}</span> ${badge}</div></div>`;
                    html += `<div style="font-size:1.1rem; line-height:1.6; margin-bottom:20px;">${p.content}</div>`;
                    
                    if(isMain) html += `<div style="background:rgba(251,191,36,0.1); padding:10px; border-radius:8px; margin-bottom:20px; display:flex; gap:10px; align-items:center;"><span style="color:var(--gold); font-size:0.8rem; font-weight:bold;">FOUNDER:</span><button class="btn btn-ghost btn-sm" onclick="app.setBadge(${p.id}, 'Good')">Good</button><button class="btn btn-ghost btn-sm" onclick="app.setBadge(${p.id}, 'Legit')">Legit</button><button class="btn btn-danger btn-sm" onclick="app.delItem('nexus_posts', ${p.id})">Delete Post</button></div>`;
                    
                    html += `<div style="border-top:1px solid var(--border); padding-top:20px;"><h4>Comments (${(p.replies||[]).length})</h4>${(p.replies||[]).map(r=>`<div class="comment-item"><div><strong class="clickable" onclick="app.openProfile('${r.author}')">${r.author}</strong></div>${r.content}</div>`).join('')}</div>`;
                    html += `<form onsubmit="app.addReply(event, ${p.id}, 'post')" style="display:flex; gap:10px; margin-top:20px;"><input placeholder="Add a comment..." required style="margin:0;"><button class="btn btn-primary">Reply</button></form>`;
                    content.innerHTML = html;
                } else if(type === 'project') {
                    const projects = await db.getData('nexus_projects');
                    const p = projects.find(x=>x.id===id);
                    let html = `<h2>${p.title}</h2><p style="color:var(--text-muted)">Project by <strong onclick="app.openProfile('${p.author}')" class="clickable">${p.author}</strong></p><p style="margin:20px 0;">${p.desc}</p><h4>Gallery</h4><div class="img-grid"><div style="width:100%; height:200px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; border-radius:10px;">Project Image Placeholder</div></div><div style="margin-top:20px;"><h4>Feedback</h4>${(p.comments||[]).map(c=>`<div class="comment-item"><strong>${c.author}:</strong> ${c.content}</div>`).join('')}</div><form onsubmit="app.addReply(event, ${p.id}, 'project')" style="display:flex; gap:10px; margin-top:20px;"><input placeholder="Comment..." required style="margin:0;"><button class="btn btn-primary">Send</button></form>`;
                    content.innerHTML = html;
                } else if(type === 'note') {
                    const materials = await db.getData('nexus_materials');
                    const m = materials.find(x=>x.id===id);
                    content.innerHTML = `<h2>${m.title}</h2><span class="tag">${m.category}</span><p style="margin:20px 0; line-height:1.6;">${m.desc||'No description.'}</p><button class="btn btn-primary" style="width:100%" onclick="app.downloadFile('${m.title}')">Download File</button>`;
                }
            },

            openProfile: async (name, isSelf=false) => {
                if(!name) name = app.currentUser.name; 
                const users = await db.getData('nexus_users');
                const u = users.find(x=>x.name===name) || {name:name, role:'student', badges:[], uploads:0};
                let badgesHTML = (u.badges||[]).map(b=>`<span class="badge bg-blue">${b}</span>`).join('');
                if(u.uploads >= 5) badgesHTML += `<span class="badge bg-green">CONTRIBUTOR</span>`;
                
                const html = `<div style="text-align:center;"><div class="profile-avatar">${u.name.charAt(0)}</div><h2>${u.name}</h2><p style="color:var(--text-muted)">${u.role}</p><div style="margin-top:10px;">${badgesHTML}</div><div class="stat-grid" style="margin-top:20px;"><div class="stat-box"><div class="stat-num">${u.uploads}</div><div class="stat-label">Uploads</div></div><div class="stat-box"><div class="stat-num">0</div><div class="stat-label">Points</div></div></div>${isSelf ? '<button class="btn btn-danger" style="margin-top:20px; width:100%;" onclick="app.logout()">Logout</button>' : ''}</div>`;
                
                if(isSelf) document.getElementById('app-root').innerHTML = `<div class="animate-enter"><div class="card profile-card">${html}</div></div>`;
                else {
                    document.getElementById('modal-overlay').classList.add('active');
                    document.getElementById('modal-body').innerHTML = html;
                }
            },

            /* --- ACTIONS --- */
            addProj: async (e) => { 
                e.preventDefault(); 
                await db.pushItem('nexus_projects',{
                    id:Date.now(), 
                    title:document.getElementById('pt').value, 
                    desc:document.getElementById('pd').value, 
                    author:app.currentUser.name, 
                    comments:[]
                }); 
                await app.renderProjects(); 
            },
            addPost: async (e) => { 
                e.preventDefault(); 
                const t=document.getElementById('p_txt').value, c=filterProfanity(t); 
                await db.pushItem('nexus_posts',{
                    id:Date.now(), 
                    author:app.currentUser.name, 
                    content:c.count>4?t:c.text, 
                    status:c.count>4?'flagged':'active', 
                    legits:[], 
                    dislikes:[], 
                    replies:[]
                }); 
                await app.renderForum(); 
            },
            
            addReply: async (e, id, type) => {
                e.preventDefault(); 
                const val = e.target.querySelector('input').value;
                if(type === 'post') { 
                    let l = await db.getData('nexus_posts'); 
                    l.find(p=>p.id===id).replies.push({author:app.currentUser.name, content:val}); 
                    await db.saveData('nexus_posts',l); 
                }
                else { 
                    let l = await db.getData('nexus_projects'); 
                    l.find(p=>p.id===id).comments.push({author:app.currentUser.name, content:val}); 
                    await db.saveData('nexus_projects',l); 
                }
                await app.openPostModal(type, id); // Refresh
            },

            setBadge: async (id, b) => { 
                let l = await db.getData('nexus_posts'); 
                l.find(p=>p.id===id).badge=b; 
                await db.saveData('nexus_posts',l); 
                showToast('Badge Added'); 
                await app.openPostModal('post', id); 
            },
            giveUserBadge: async (name, b) => { 
                let l = await db.getData('nexus_users'); 
                let u=l.find(x=>x.name===name); 
                if(u && !u.badges.includes(b)) u.badges.push(b); 
                await db.saveData('nexus_users',l); 
                showToast('Badge Assigned'); 
            },

            doUpload: async (e) => { 
                e.preventDefault(); 
                await db.pushItem('nexus_materials',{
                    id:Date.now(), 
                    title:document.getElementById('ut').value, 
                    category:document.getElementById('uc').value, 
                    desc:document.getElementById('ud').value, 
                    author:app.currentUser.name, 
                    status:'pending'
                });
                let users = await db.getData('nexus_users'); 
                let me = users.find(u=>u.name===app.currentUser.name); 
                if(me) me.uploads = (me.uploads||0)+1; 
                await db.saveData('nexus_users', users);
                showToast('Submitted'); 
                app.navigate('home'); 
            },

            addEvt: async (e) => { 
                e.preventDefault(); 
                await db.pushItem('nexus_events',{
                    title:document.getElementById('et').value, 
                    desc:document.getElementById('ed').value
                }); 
                showToast('Event Created'); 
            },
            admDecide: async (id, s) => { 
                let l = await db.getData('nexus_materials'); 
                if(s==='reject') l=l.filter(m=>m.id!==id); 
                else l.find(m=>m.id===id).status='approved'; 
                await db.saveData('nexus_materials',l); 
                await app.renderAdmin(); 
            },
            delItem: async (k, id) => { 
                if(confirm('Delete?')) { 
                    let l = (await db.getData(k)).filter(i=>i.id!==id); 
                    await db.saveData(k,l); 
                    document.getElementById('modal-overlay').classList.remove('active'); 
                    k.includes('proj') ? await app.renderProjects() : await app.renderForum(); 
                    showToast('Deleted'); 
                } 
            },

            downloadFile: (title) => {
                const blob = new Blob([`Simulated PDF Content: ${title}\nDownloaded from Mechatronics Hub`], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = title + ".txt"; document.body.appendChild(a); a.click(); document.body.removeChild(a); showToast('Download Started');
            },
            closeModal: () => document.getElementById('modal-overlay').classList.remove('active')
        };
        
        app.init();
    </script>
</body>
</html>
